<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Audio Tap MVP</title>
  <style>
    :root {
      --bg: #0e141b;
      --panel: #18222f;
      --text: #ecf2f8;
      --muted: #9aafc3;
      --off: #384759;
      --on: #2e9b67;
      --warn: #e8a83a;
      --danger: #df4f4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(90vw 70vh at 20% 20%, #1a2532 0%, var(--bg) 70%);
      color: var(--text);
      font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .card {
      width: min(560px, 92vw);
      background: linear-gradient(160deg, #1f2c3b, var(--panel));
      border: 1px solid #2e3f51;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 14px;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0;
    }
    button {
      border: 0;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 12px 18px;
      cursor: pointer;
      min-width: 110px;
      transition: transform 80ms ease, opacity 80ms ease;
      background: var(--off);
    }
    button.on { background: var(--on); }
    button:active { transform: translateY(1px); }
    .meter-shell {
      height: 24px;
      width: 100%;
      background: #0f1822;
      border: 1px solid #304254;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--danger) 0%, var(--warn) 45%, var(--on) 100%);
      transition: width 120ms linear;
    }
    .kv {
      color: var(--muted);
      font-size: 0.93rem;
    }
    .mono { font-variant-numeric: tabular-nums; }
    .error {
      margin-top: 12px;
      min-height: 1.2em;
      color: #ff9b9b;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Core Audio Tap Browser MVP</h1>
    <div class="row">
      <button id="toggleBtn">ON</button>
      <div class="kv">State: <span class="mono" id="stateTxt">OFF</span></div>
      <div class="kv">Level: <span class="mono" id="dbTxt">-120.0 dBFS</span></div>
    </div>
    <div class="meter-shell"><div id="meter" class="meter-fill"></div></div>
    <div class="row">
      <div class="kv">Helper API:</div>
      <div class="mono kv" id="apiTxt">http://127.0.0.1:8765</div>
    </div>
    <div id="errorTxt" class="error"></div>
  </main>

  <script>
    const API_BASE = (window.location.protocol === "http:" || window.location.protocol === "https:")
      ? window.location.origin
      : "http://127.0.0.1:8765";
    const toggleBtn = document.getElementById("toggleBtn");
    const stateTxt = document.getElementById("stateTxt");
    const dbTxt = document.getElementById("dbTxt");
    const meter = document.getElementById("meter");
    const errorTxt = document.getElementById("errorTxt");
    const apiTxt = document.getElementById("apiTxt");

    apiTxt.textContent = API_BASE;
    let running = false;
    let es = null;

    function dbToPercent(db) {
      const clamped = Math.max(-60, Math.min(0, db));
      return ((clamped + 60) / 60) * 100;
    }

    function setUI(state) {
      running = !!state.running;
      const db = Number.isFinite(state.db) ? state.db : -120;
      stateTxt.textContent = running ? "ON" : "OFF";
      dbTxt.textContent = `${db.toFixed(1)} dBFS`;
      meter.style.width = `${dbToPercent(db).toFixed(1)}%`;
      toggleBtn.textContent = running ? "OFF" : "ON";
      toggleBtn.classList.toggle("on", running);
      errorTxt.textContent = state.error || "";
    }

    async function call(path, method) {
      const res = await fetch(`${API_BASE}${path}`, { method });
      if (!res.ok) {
        throw new Error(`${method} ${path} failed (${res.status})`);
      }
      return await res.json();
    }

    async function refreshState() {
      try {
        const state = await call("/state", "GET");
        setUI(state);
      } catch (err) {
        errorTxt.textContent = `Cannot reach helper: ${err.message}`;
      }
    }

    function connectEvents() {
      if (es) {
        es.close();
        es = null;
      }
      es = new EventSource(`${API_BASE}/events`);
      es.onmessage = (evt) => {
        try {
          const state = JSON.parse(evt.data);
          setUI(state);
        } catch (_) {
        }
      };
      es.onerror = () => {
        errorTxt.textContent = "Event stream disconnected. Is helper running?";
      };
    }

    toggleBtn.addEventListener("click", async () => {
      try {
        errorTxt.textContent = "";
        toggleBtn.disabled = true;
        const path = running ? "/stop" : "/start";
        const state = await call(path, "POST");
        setUI(state);
      } catch (err) {
        errorTxt.textContent = err.message;
      } finally {
        toggleBtn.disabled = false;
      }
    });

    connectEvents();
    refreshState();
  </script>
</body>
</html>
