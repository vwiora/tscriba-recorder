<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>System Audio Tap MVP</title>
  <style>
    :root {
      --bg: #0e141b;
      --panel: #18222f;
      --text: #ecf2f8;
      --muted: #9aafc3;
      --off: #384759;
      --on: #2e9b67;
      --warn: #e8a83a;
      --danger: #df4f4f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(90vw 70vh at 20% 20%, #1a2532 0%, var(--bg) 70%);
      color: var(--text);
      font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    .card {
      width: min(560px, 92vw);
      background: linear-gradient(160deg, #1f2c3b, var(--panel));
      border: 1px solid #2e3f51;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    h1 {
      margin: 0 0 14px;
      font-size: 1.1rem;
      letter-spacing: 0.3px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0;
    }
    button {
      border: 0;
      border-radius: 10px;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 12px 18px;
      cursor: pointer;
      min-width: 110px;
      transition: transform 80ms ease, opacity 80ms ease;
      background: var(--off);
    }
    button.on { background: var(--on); }
    button:active { transform: translateY(1px); }
    .meter-shell {
      height: 24px;
      width: 100%;
      background: #0f1822;
      border: 1px solid #304254;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--danger) 0%, var(--warn) 45%, var(--on) 100%);
      transition: width 120ms linear;
    }
    .kv {
      color: var(--muted);
      font-size: 0.93rem;
    }
    .mono { font-variant-numeric: tabular-nums; }
    .error {
      margin-top: 12px;
      min-height: 1.2em;
      color: #ff9b9b;
      font-size: 0.9rem;
    }
    .hint-panel {
      margin-top: 14px;
      border: 1px solid #304254;
      border-radius: 10px;
      padding: 10px;
      background: #111b26;
    }
    .hint-title {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .hint-intent {
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .hint-score {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 8px;
    }
    .hint-answer {
      width: 100%;
      min-height: 70px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid #3b5066;
      background: #0d1721;
      color: var(--text);
      padding: 8px;
      font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.35;
    }
    .hint-actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }
    .btn-small {
      min-width: 0;
      padding: 8px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
      background: #41576e;
    }
    .debug-panel {
      margin-top: 14px;
      border: 1px dashed #3b5066;
      border-radius: 10px;
      padding: 10px;
      background: #0d1721;
    }
    .debug-text {
      width: 100%;
      min-height: 80px;
      resize: vertical;
      border-radius: 8px;
      border: 1px solid #3b5066;
      background: #0a131b;
      color: #cfe3f6;
      padding: 8px;
      font-family: Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.85rem;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Core Audio Tap Browser MVP</h1>
    <div class="row">
      <button id="toggleBtn">ON</button>
      <div class="kv">State: <span class="mono" id="stateTxt">OFF</span></div>
      <div class="kv">Level: <span class="mono" id="dbTxt">-120.0 dBFS</span></div>
    </div>
    <div class="meter-shell"><div id="meter" class="meter-fill"></div></div>
    <div class="row">
      <div class="kv">Helper API:</div>
      <div class="mono kv" id="apiTxt">http://127.0.0.1:8765</div>
    </div>

    <section class="hint-panel">
      <div class="hint-title">Objection helper</div>
      <div class="hint-score">Detector: <span class="mono" id="detectorTxt">-</span></div>
      <div class="hint-intent">Erkannt: <span class="mono" id="intentTxt">-</span></div>
      <div class="hint-score">Konfidenz: <span class="mono" id="scoreTxt">-</span></div>
      <textarea id="suggestionTxt" class="hint-answer" readonly>Vorschlag erscheint hier.</textarea>
      <div class="hint-actions">
        <button id="resetObjectionBtn" class="btn-small" type="button">Reset Objection</button>
      </div>
    </section>
    <section class="hint-panel">
      <div class="hint-title">Tone of voice (experimental)</div>
      <div class="hint-score">Detector: <span class="mono" id="toneStatusTxt">-</span></div>
      <div class="hint-intent">Tone: <span class="mono" id="toneLabelTxt">-</span></div>
      <div class="hint-score">Konfidenz: <span class="mono" id="toneScoreTxt">-</span></div>
      <div class="hint-score">Tone scores (raw):</div>
      <textarea id="toneScoresTxt" class="debug-text" readonly>No tone scores yet.</textarea>
      <div class="hint-actions">
        <button id="toneToggleBtn" class="btn-small" type="button">Tone ON</button>
      </div>
    </section>
    <section class="debug-panel">
      <div class="hint-title">ASR debug (temporary)</div>
      <div class="hint-score">Last ASR update: <span class="mono" id="asrUpdateTxt">-</span></div>
      <textarea id="asrTextTxt" class="debug-text" readonly>No ASR text yet.</textarea>
    </section>

    <div id="errorTxt" class="error"></div>
  </main>

  <script>
    const API_BASE = (window.location.protocol === "http:" || window.location.protocol === "https:")
      ? window.location.origin
      : "http://127.0.0.1:8765";
    const toggleBtn = document.getElementById("toggleBtn");
    const stateTxt = document.getElementById("stateTxt");
    const dbTxt = document.getElementById("dbTxt");
    const meter = document.getElementById("meter");
    const errorTxt = document.getElementById("errorTxt");
    const apiTxt = document.getElementById("apiTxt");
    const intentTxt = document.getElementById("intentTxt");
    const scoreTxt = document.getElementById("scoreTxt");
    const suggestionTxt = document.getElementById("suggestionTxt");
    const detectorTxt = document.getElementById("detectorTxt");
    const resetObjectionBtn = document.getElementById("resetObjectionBtn");
    const toneStatusTxt = document.getElementById("toneStatusTxt");
    const toneLabelTxt = document.getElementById("toneLabelTxt");
    const toneScoreTxt = document.getElementById("toneScoreTxt");
    const toneScoresTxt = document.getElementById("toneScoresTxt");
    const toneToggleBtn = document.getElementById("toneToggleBtn");
    const asrUpdateTxt = document.getElementById("asrUpdateTxt");
    const asrTextTxt = document.getElementById("asrTextTxt");

    apiTxt.textContent = API_BASE;
    let running = false;
    let es = null;

    function dbToPercent(db) {
      const clamped = Math.max(-60, Math.min(0, db));
      return ((clamped + 60) / 60) * 100;
    }

    function setUI(state) {
      running = !!state.running;
      const db = Number.isFinite(state.db) ? state.db : -120;
      stateTxt.textContent = running ? "ON" : "OFF";
      dbTxt.textContent = `${db.toFixed(1)} dBFS`;
      meter.style.width = `${dbToPercent(db).toFixed(1)}%`;
      toggleBtn.textContent = running ? "OFF" : "ON";
      toggleBtn.classList.toggle("on", running);
      const intent = (state.lastIntent || "").trim();
      const score = Number(state.lastIntentScore);
      detectorTxt.textContent = (state.detectorStatus || "-").toString();
      intentTxt.textContent = intent || "-";
      scoreTxt.textContent = Number.isFinite(score) && score > 0 ? `${Math.round(score * 100)}%` : "-";
      suggestionTxt.value = (state.lastSuggestion || "").trim() || "Vorschlag erscheint hier.";
      const toneLabel = (state.toneLabel || "").trim();
      const toneScore = Number(state.toneScore);
      const toneScores = state.toneScores || {};
      const toneEnabled = !!state.toneEnabled;
      toneStatusTxt.textContent = (state.toneStatus || "-").toString();
      toneLabelTxt.textContent = toneLabel || "-";
      toneScoreTxt.textContent = Number.isFinite(toneScore) && toneScore > 0 ? `${Math.round(toneScore * 100)}%` : "-";
      toneToggleBtn.textContent = toneEnabled ? "Tone OFF" : "Tone ON";
      try {
        const entries = Object.entries(toneScores);
        if (entries.length === 0) {
          toneScoresTxt.value = "No tone scores yet.";
        } else {
          entries.sort((a, b) => Number(b[1]) - Number(a[1]));
          toneScoresTxt.value = entries
            .map(([k, v]) => `${k}: ${(Number(v) * 100).toFixed(1)}%`)
            .join("\n");
        }
      } catch (_) {
        toneScoresTxt.value = "No tone scores yet.";
      }
      const lastText = (state.lastText || "").trim();
      asrTextTxt.value = lastText || "No ASR text yet.";
      const lastAt = Number(state.lastTextAt);
      if (Number.isFinite(lastAt) && lastAt > 0) {
        asrUpdateTxt.textContent = new Date(lastAt * 1000).toLocaleTimeString();
      } else {
        asrUpdateTxt.textContent = "-";
      }
      errorTxt.textContent = state.error || "";
    }

    async function call(path, method) {
      const res = await fetch(`${API_BASE}${path}`, { method });
      if (!res.ok) {
        throw new Error(`${method} ${path} failed (${res.status})`);
      }
      return await res.json();
    }

    async function refreshState() {
      try {
        const state = await call("/state", "GET");
        setUI(state);
      } catch (err) {
        errorTxt.textContent = `Cannot reach helper: ${err.message}`;
      }
    }

    function connectEvents() {
      if (es) {
        es.close();
        es = null;
      }
      es = new EventSource(`${API_BASE}/events`);
      es.onmessage = (evt) => {
        try {
          const state = JSON.parse(evt.data);
          setUI(state);
        } catch (_) {
        }
      };
      es.onerror = () => {
        errorTxt.textContent = "Event stream disconnected. Is helper running?";
      };
    }

    toggleBtn.addEventListener("click", async () => {
      try {
        errorTxt.textContent = "";
        toggleBtn.disabled = true;
        const path = running ? "/stop" : "/start";
        const state = await call(path, "POST");
        setUI(state);
      } catch (err) {
        errorTxt.textContent = err.message;
      } finally {
        toggleBtn.disabled = false;
      }
    });

    resetObjectionBtn.addEventListener("click", async () => {
      try {
        errorTxt.textContent = "";
        resetObjectionBtn.disabled = true;
        const state = await call("/reset_objection", "POST");
        setUI(state);
      } catch (err) {
        errorTxt.textContent = err.message;
      } finally {
        resetObjectionBtn.disabled = false;
      }
    });

    toneToggleBtn.addEventListener("click", async () => {
      try {
        errorTxt.textContent = "";
        toneToggleBtn.disabled = true;
        const toneEnabled = toneToggleBtn.textContent === "Tone OFF";
        const path = toneEnabled ? "/tone_off" : "/tone_on";
        const state = await call(path, "POST");
        setUI(state);
      } catch (err) {
        errorTxt.textContent = err.message;
      } finally {
        toneToggleBtn.disabled = false;
      }
    });

    connectEvents();
    refreshState();
  </script>
</body>
</html>
